name: AI Security Weekly Roll-up

on:
  schedule:
    # Sundays 22:57 UTC = Mondays 04:27 IST, after the daily digest's runs,
    # so the roll-up is waiting before the start of the week.
    - cron: '57 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digest-state
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post weekly roll-up
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional — adds research threads
        run: python main.py --weekly
