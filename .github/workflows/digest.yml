name: AI Security Digest

on:
  schedule:
    # Daily at 03:30 UTC (09:00 IST). Adjust if you want.
    - cron: '30 3 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit updated state.json

# Daily and weekly runs both read state.json; never let them overlap.
concurrency:
  group: digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}  # optional
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional — enables LLM filter
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}  # optional — enables X/Twitter source
        run: python main.py

      # Runs even if the digest step failed: source health is saved either way.
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git add state.json
            git commit -m "chore: update digest state [skip ci]"
            git push
          else
            echo "No state changes."
          fi

      # Turns the run red when a source has been failing for several runs in
      # a row, so a dead feed can't silently produce "0 items" for weeks.
      - name: Check source health
        if: always()
        run: python main.py --check-health
